name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-frontend.txt

      - name: Compile source
        run: python -m compileall -q app tests frontend

      - name: Run tests
        run: python -m pytest -q
