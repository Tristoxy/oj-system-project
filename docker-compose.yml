services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OJ_JUDGE_BACKEND: local
    volumes:
      - ./data:/app/data

# The API image includes Python and g++ for the required local judge mode.
# Advance 3 is run from a Docker-enabled host after building the two dedicated
# judge images; see README.md. A host Docker socket is deliberately not mounted
# into this service because that grants container-root control of the host.
